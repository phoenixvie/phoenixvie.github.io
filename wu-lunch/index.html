<!DOCTYPE html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>WU Campus Mittagsmenüs</title>
  <meta name="description" content="Mittagsmenüs rund um den WU Campus mit Tagesansicht und Wochenübersicht." />
  <style>
    :root{
      --blue:#3e87ea;
      --blue-dark:#2f79df;
      --line:#d9d9d9;
      --text:#444;
      --muted:#777;
      --bg:#efefef;
      --panel:#f8f8f8;
      --white:#fff;
    }
    *{box-sizing:border-box}
    body{margin:0;background:var(--bg);font-family:Arial,Helvetica,sans-serif;color:var(--text)}
    a{color:inherit;text-decoration:none}
    .page{max-width:1660px;margin:0 auto 32px;padding:0 18px}
    .hero{position:relative;width:100%;height:220px;overflow:hidden;border-radius:0 0 2px 2px;background:#dfe6ef}
    .hero img{width:100%;height:100%;object-fit:cover;display:block}

    .toolbar{display:flex;flex-direction:column;align-items:center;margin-top:12px;gap:14px}
    .day-tabs,.view-tabs{display:flex;align-items:center;justify-content:center;flex-wrap:wrap}
    .day-tabs{width:min(1140px,100%)}
    .day-tab{
      min-width:92px;
      padding:9px 10px;
      border:1px solid #bfc6cf;
      border-right:0;
      background:#f5f5f5;
      color:#555;
      font-size:16px;
      line-height:1;
      cursor:pointer;
      text-align:center;
      position:relative;
    }
    .day-tab:first-child{border-radius:4px 0 0 4px}
    .day-tab:last-child{border-right:1px solid #bfc6cf;border-radius:0 4px 4px 0}
    .day-tab.active{background:var(--blue);color:#fff;border-color:#6c95d5;z-index:1}
    .day-tab .small-date{display:block;font-size:10px;margin-top:4px;opacity:.95;letter-spacing:.02em}
    .day-tab:not(.active) .small-date{color:#888}

    .view-tabs{gap:0}
    .view-tab{
      padding:8px 24px;
      font-size:15px;
      border:1px solid #a9b9d2;
      background:#fff;
      color:#5c6a75;
      cursor:pointer;
      min-width:98px;
      text-align:center;
    }
    .view-tab:first-child{border-radius:4px 0 0 4px;border-right:0}
    .view-tab:last-child{border-radius:0 4px 4px 0}
    .view-tab.active{background:var(--blue);border-color:#6c95d5;color:#fff}

    .date-label{margin-top:2px;font-size:13px;color:#707070;text-align:center}

    .content-wrap{width:min(1240px,100%);margin:16px auto 0;background:transparent}
    .legend{display:flex;justify-content:space-between;align-items:center;gap:16px;margin:0 2px 12px;color:#666;font-size:13px}
    .legend strong{color:#3a3a3a}
    .legend .hint{font-size:12px;color:#888}

    .list-view,.map-view{display:none}
    .list-view.active,.map-view.active{display:block}

    .list{
      background:transparent;
      border-radius:6px;
      overflow:hidden;
    }
    .row{
      display:grid;
      grid-template-columns:110px 1fr 92px;
      gap:16px;
      align-items:start;
      padding:16px 6px 16px 0;
      border-bottom:1px solid #ddd;
    }
    .row:last-child{border-bottom:0}
    .logo-cell{display:flex;justify-content:center;padding-top:2px}
    .logo-box{
      width:84px;height:84px;border-radius:2px;display:flex;align-items:center;justify-content:center;
      text-align:center;font-weight:bold;color:#fff;padding:8px;line-height:1.05;font-size:24px;letter-spacing:-.02em;
      box-shadow:0 0 0 1px rgba(0,0,0,.06) inset;
    }
    .logo-box small{display:block;font-size:12px;font-weight:normal;letter-spacing:0}
    .logo-mensa{background:#e30613;font-size:22px;text-transform:lowercase}
    .logo-campus{background:#c46c2a;font-size:16px}
    .logo-baschly{background:#222;font-size:18px}
    .logo-glashaus{background:#aacd61;color:#173a17;font-size:16px}
    .logo-losteria{background:#e9e4d8;color:#222;font-size:14px}

    .menu-cell{min-width:0}
    .restaurant-title{display:flex;align-items:baseline;gap:10px;flex-wrap:wrap;margin-bottom:6px}
    .restaurant-title h3{margin:0;font-size:18px;color:#333;font-weight:bold}
    .status-pill{font-size:11px;padding:2px 7px;border-radius:999px;background:#ececec;color:#666}
    .status-pill.verified{background:#e7f3e5;color:#477a3d}
    .status-pill.undated{background:#fff4dd;color:#9a7423}
    .status-pill.seasonal{background:#e8efff;color:#566aa0}

    .menu-lines{display:flex;flex-direction:column;gap:4px}
    .menu-line{font-size:14px;line-height:1.35;color:#4b4b4b}
    .menu-line .category{font-weight:normal;color:#595959}
    .menu-line .separator{color:#999;padding:0 6px}
    .menu-line .extra{color:#888;font-size:12px}
    .source-note{margin-top:7px;font-size:12px;color:#8a8a8a}
    .source-link{display:inline-block;margin-top:4px;font-size:12px;color:#5b86c7}

    .price-cell{display:flex;flex-direction:column;align-items:flex-end;gap:7px;padding-top:31px}
    .price{font-size:18px;color:#4a4a4a;white-space:nowrap}
    .price.empty{color:#bbb}

    .empty-row{padding:10px 0;color:#9a9a9a;font-size:13px}

    .map-view{background:#fff;border:1px solid #ddd;border-radius:6px;padding:18px}
    .map-stage{position:relative;height:430px;border-radius:4px;overflow:hidden;background:#e9eef3;margin-bottom:16px}
    .map-stage::before{content:"";position:absolute;inset:0;background:url('assets/background-campus.png') center/cover no-repeat;opacity:.22}
    .map-stage::after{content:"WU CAMPUS OVERVIEW";position:absolute;top:10px;left:14px;font-size:12px;font-weight:bold;color:#5f6670;letter-spacing:.12em}
    .marker{position:absolute;transform:translate(-50%,-50%);display:flex;flex-direction:column;align-items:center;gap:6px}
    .pin{width:20px;height:20px;border-radius:50%;background:var(--blue);border:3px solid #fff;box-shadow:0 3px 8px rgba(0,0,0,.18)}
    .marker-label{background:rgba(255,255,255,.95);border:1px solid #d7dde7;border-radius:20px;padding:5px 10px;font-size:12px;color:#3f4d5d;white-space:nowrap}
    .map-list{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}
    .map-card{border:1px solid #ddd;border-radius:6px;padding:12px;background:#fafafa}
    .map-card h4{margin:0 0 7px;font-size:15px;color:#333}
    .map-card p{margin:0;font-size:13px;color:#666;line-height:1.45}

    .footer-note{width:min(1240px,100%);margin:18px auto 0;font-size:12px;color:#7a7a7a;line-height:1.5;text-align:left}

    @media (max-width: 980px){
      .row{grid-template-columns:96px 1fr;gap:12px}
      .price-cell{grid-column:2;align-items:flex-start;padding-top:8px;gap:3px}
      .price{font-size:15px}
      .price-cell::before{content:"Preise";font-size:11px;color:#888;text-transform:uppercase;letter-spacing:.08em;margin-bottom:2px}
      .map-list{grid-template-columns:1fr}
    }
    @media (max-width: 720px){
      .hero{height:145px}
      .page{padding:0 10px 24px}
      .day-tab{min-width:calc(25% - 1px);font-size:14px;padding:8px 6px}
      .view-tab{font-size:14px;padding:8px 18px}
      .row{grid-template-columns:1fr;padding:14px 0}
      .logo-cell{justify-content:flex-start}
      .logo-box{width:74px;height:74px}
      .legend{flex-direction:column;align-items:flex-start}
    }
  
.logo-image{width:92px;height:76px;object-fit:contain;max-width:100%}.logo-box:has(.logo-image){background:white;box-shadow:none}.map-stage{height:420px;background:#e7edf2}.map-stage:before,.map-stage:after{display:none}.map-error{padding:24px;color:#555;font-size:14px}

/* Kompakte, weiße Listenansicht – Stand 05.11.2026 */
:root { --bg:#fff; --panel:#fff; }
html,body,.page { background:#fff; }
.page { max-width:none; padding:0 22px 28px; }
.hero { height: clamp(138px, 22vw, 250px); border-radius:0; margin:0 -22px; width:calc(100% + 44px); }
.hero img { object-fit:cover; object-position:center center; }
.toolbar { gap:9px; margin-top:12px; }
.date-label,.legend,.footer-note,.source-note,.status-pill,.price-cell,.menu-line .category,.menu-line .separator,.menu-line .extra { display:none !important; }
.content-wrap { max-width:1110px; margin:18px auto 0; }
.row { grid-template-columns:100px minmax(0,1fr); gap:14px; padding:17px 4px 19px 0; border-bottom:1px solid #e8e8e8; }
.logo-cell { justify-content:center; padding-top:0 }
.logo-box { width:76px; height:76px; font-size:18px }
.logo-image { width:76px; height:70px; }
.restaurant-title { margin:0 0 7px }
.restaurant-title h3 { font-size:15px; letter-spacing:0; font-weight:700 }
.menu-lines { gap:7px; }
.menu-line { display:flex; gap:16px; justify-content:space-between; align-items:baseline; font-size:13px; line-height:1.46; }
.dish-text { flex:1; min-width:0; overflow-wrap:break-word; }
.dish-price { flex:none; color:#444; font-size:13px; white-space:nowrap; font-weight:600; text-align:right; }
.source-link { margin-top:7px; font-size:11px; color:#777; }
.day-tabs { flex-wrap:nowrap; max-width:1120px; }
.day-tab { flex:1; min-width:0; }
@media(max-width:750px) {
 .page{padding:0 13px 24px}
 .hero { margin:0 -13px; width:calc(100% + 26px); height:clamp(132px,30vw,205px); }
 .toolbar { align-items:stretch; gap:10px }
 .day-tabs { width:100%; justify-content:flex-start; overflow-x:auto; overscroll-behavior-inline:contain; -webkit-overflow-scrolling:touch; padding-bottom:4px; }
 .day-tab { flex:0 0 91px; min-width:91px; font-size:13px; }
 .view-tabs { align-self:center }
 .content-wrap { margin:10px auto 0; }
 .row { grid-template-columns:70px minmax(0,1fr); gap:10px; padding:14px 0; }
 .logo-box {width:65px;height:65px;font-size:14px}
 .logo-image {width:64px;height:58px}
 .menu-line { font-size:12.5px; gap:8px }
 .dish-price {font-size:12.5px}
 .restaurant-title h3 {font-size:14px}
 .map-stage {height:330px}
}
@media(max-width:370px) {
 .row { grid-template-columns:61px minmax(0,1fr); gap:9px }
 .logo-box {width:55px;height:55px;font-size:12px}
 .logo-image {width:54px;height:52px}
 .menu-line,.dish-price {font-size:12px}
}


/* Sichere Leaflet-Basisregeln, auch wenn das externe Stylesheet blockiert ist */
.leaflet-container{position:relative;overflow:hidden;background:#e6edf1;outline-offset:1px;touch-action:none;font-family:Arial,sans-serif}
.leaflet-pane,.leaflet-tile,.leaflet-marker-icon,.leaflet-marker-shadow,.leaflet-tile-container,.leaflet-pane>svg,.leaflet-pane>canvas,.leaflet-zoom-box,.leaflet-image-layer,.leaflet-layer{position:absolute;left:0;top:0}
.leaflet-pane{z-index:400}
.leaflet-tile-pane{z-index:200}
.leaflet-overlay-pane{z-index:400}
.leaflet-shadow-pane{z-index:500}
.leaflet-marker-pane{z-index:600}
.leaflet-tooltip-pane{z-index:650}
.leaflet-popup-pane{z-index:700}
.leaflet-map-pane canvas{z-index:100}
.leaflet-map-pane svg{z-index:200}
.leaflet-tile{filter:inherit;visibility:hidden}
.leaflet-tile-loaded{visibility:inherit}
.leaflet-zoom-animated{transform-origin:0 0}
.leaflet-container img{max-width:none!important;max-height:none!important}
.leaflet-top,.leaflet-bottom{position:absolute;z-index:1000;pointer-events:none}
.leaflet-top{top:0}.leaflet-bottom{bottom:0}.leaflet-left{left:0}.leaflet-right{right:0}
.leaflet-control{position:relative;z-index:800;pointer-events:auto;clear:both}
.leaflet-top .leaflet-control{margin-top:10px}
.leaflet-bottom .leaflet-control{margin-bottom:10px}
.leaflet-left .leaflet-control{margin-left:10px;float:left}
.leaflet-right .leaflet-control{margin-right:10px;float:right}
.leaflet-control-zoom a{display:block;height:30px;width:30px;text-align:center;background:#fff;border:1px solid #bbb;font-weight:700;font-size:20px;line-height:30px;color:#333;text-decoration:none}
.leaflet-control-zoom a:first-child{border-radius:4px 4px 0 0}
.leaflet-control-zoom a:last-child{border-radius:0 0 4px 4px}
.leaflet-control-attribution{background:rgba(255,255,255,.88);font-size:11px;padding:3px 5px}
.leaflet-marker-icon{border:0}
.leaflet-popup{position:absolute;text-align:center;margin-bottom:20px;transform:translate(-50%,-100%)}
.leaflet-popup-content-wrapper{background:#fff;padding:8px 14px;border-radius:8px;box-shadow:0 3px 12px #0002;text-align:left;min-width:180px}
.leaflet-popup-content{font-size:13px;line-height:1.5}
.leaflet-popup-tip-container{width:20px;height:12px;position:absolute;left:50%;transform:translateX(-50%);overflow:hidden}
.leaflet-popup-tip{width:12px;height:12px;background:#fff;transform:rotate(45deg);position:absolute;top:-8px;left:4px}
.leaflet-popup-close-button{position:absolute;right:6px;top:4px;font-size:18px;color:#444;z-index:5}
.leaflet-div-icon{background:transparent;border:0}
.map-pin{display:grid;place-items:center;width:38px;height:38px;border:3px solid #fff;border-radius:50%;color:#fff;font-size:18px;font-weight:800;box-shadow:0 3px 9px #0004}
.logo-box{font-size:34px!important;font-weight:800!important;letter-spacing:0!important;color:#fff!important;border-radius:9px!important;box-shadow:none!important}
.logo-mensa{background:#e30613!important}
.logo-campus{background:#387dda!important}
.logo-glashaus{background:#6f9e39!important}
.logo-baschly{background:#8a55a6!important}
.logo-losteria{background:#bc7837!important}
.restaurant-title h3,.menu-line,.dish-price{font-size:15px!important;line-height:1.5!important}
.dish-price{font-weight:600!important}
.map-stage{height:450px;min-height:360px;isolation:isolate}
.map-stage .leaflet-container{width:100%;height:100%}
@media(max-width:750px){
 .restaurant-title h3,.menu-line,.dish-price{font-size:14px!important;line-height:1.45!important}
 .logo-box{font-size:27px!important}
 .map-stage{height:350px;min-height:320px}
}
</style>

    <section class="toolbar" aria-label="Navigation">
      <div class="day-tabs" id="dayTabs"></div>
      <div class="view-tabs" role="tablist" aria-label="Ansicht wählen">
        <button class="view-tab active" data-view="list" aria-selected="true">Listview</button>
        <button class="view-tab" data-view="map" aria-selected="false">Mapview</button>
      </div>

    <main class="content-wrap">
      <section class="list-view active" id="listView"></section>

      <section class="map-view" id="mapView">
        <div class="map-stage" id="mapStage"></div>
        <div class="map-list" id="mapList"></div>
      </section>

  <script src="data.js?v=3"></script>
  <script>
    const DATA = window.CAMPUS_LUNCH_DATA;
    const WEEKDAY_NAMES = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
    const SHORT_WEEKDAY = ['Sonntag','Montag','Dienstag','Mittwoch','Donnerstag','Freitag','Samstag'];
    const MONDAY_FIRST = [1,2,3,4,5,6,0];
    const tabContainer = document.getElementById('dayTabs');
    const listView = document.getElementById('listView');
    const mapView = document.getElementById('mapView');
    const mapStage = document.getElementById('mapStage');
    const mapList = document.getElementById('mapList');
    const legendTitle = null;
    const legendRight = null;
    const dateLabel = null;
    const footerNote = null;

    const brandClasses = {
      mensa:'logo-mensa', campus:'logo-campus', baschly:'logo-baschly', glashaus:'logo-glashaus', losteria:'logo-losteria'
    };
    const logoUrls = {"mensa":"https://www.wu.ac.at/fileadmin/wu/h/campus/infrastructure/catering/Logo_Mensa.jpg","campus":"https://www.wu.ac.at/fileadmin/wu/h/campus/infrastructure/catering/Logo_Das_Campus.jpg","baschly":"https://www.wu.ac.at/fileadmin/wu/h/campus/infrastructure/catering/Baschly.jpg","losteria":"https://www.wu.ac.at/fileadmin/wu/h/campus/infrastructure/catering/Logo_Losteria.jpg","glashaus":"https://www.dasglashaus.at/favicon.ico"};
    const brandLabels = {
      mensa:'mensa', campus:'das campus', baschly:'BASCHLY', glashaus:'DAS\nGLASHAUS', losteria:"L'Osteria"
    };
    const markerPositions = {
      mensa:{left:'31%', top:'70%'},
      campus:{left:'47%', top:'57%'},
      baschly:{left:'67%', top:'60%'},
      glashaus:{left:'58%', top:'35%'},
      losteria:{left:'18%', top:'56%'}
    };

    function formatDate(dateStr){
      const d = new Date(dateStr + 'T12:00:00');
      return d.toLocaleDateString('de-AT',{weekday:'long', day:'numeric', month:'long'});
    }
    function formatShortDate(dateStr){
      const d = new Date(dateStr + 'T12:00:00');
      return d.toLocaleDateString('de-AT',{day:'2-digit', month:'2-digit'});
    }
    function formatPrice(value){
      return value == null ? '' : value.toLocaleString('de-AT',{minimumFractionDigits:1, maximumFractionDigits:2}) + ' €';
    }
    function getStatusLabel(status){
      if(status==='verified') return 'bestätigt';
      if(status==='undated') return 'ohne Datum';
      if(status==='seasonal') return 'Saisonkarte';
      return status;
    }
    function getStatusClass(status){ return status || ''; }

    function getWeekDates(){
      const start = new Date(DATA.weekStart + 'T12:00:00');
      return Array.from({length:7}, (_,i)=>{
        const d = new Date(start); d.setDate(start.getDate()+i);
        const iso = d.toISOString().slice(0,10);
        return {iso, date:d};
      });
    }

    const weekDates = getWeekDates();
    function defaultSelectedDate(){
      const todayIso=new Intl.DateTimeFormat('en-CA',{timeZone:'Europe/Vienna',year:'numeric',month:'2-digit',day:'2-digit'}).format(new Date());
      if(weekDates.some(d=>d.iso===todayIso))return todayIso;
      return weekDates.find(d=>d.iso===DATA.checkedAt?.slice(0,10))?.iso || weekDates[0].iso;
    }

    let selectedDate = defaultSelectedDate();
    let currentView = 'list';

    function renderTabs(){
      tabContainer.innerHTML = '';
      weekDates.forEach(({iso,date})=>{
        const weekday = date.getDay();
        const btn = document.createElement('button');
        btn.className = 'day-tab' + (iso === selectedDate ? ' active' : '');
        btn.innerHTML = `${SHORT_WEEKDAY[weekday]}<span class="small-date">${formatShortDate(iso)}</span>`;
        btn.addEventListener('click',()=>{selectedDate = iso; update();});
        tabContainer.appendChild(btn);
      });
    }

    function dishesForRestaurant(restaurant){
      const items = restaurant.days?.[selectedDate] || [];
      if (items.length) return items;
      if (restaurant.status === 'seasonal' && Array.isArray(restaurant.seasonal)) return restaurant.seasonal;
      return [];
    }


    function visibleDishes(restaurant){
      const raw=dishesForRestaurant(restaurant);
      if(restaurant.id==='glashaus'){
        return raw.map(item=>({name:'Suppe + '+item.name,price:item.price}));
      }
      if(restaurant.id==='mensa'){
        const soup=raw.find(item=>item.category==='Tagessuppe');
        const mains=raw.filter(item=>item.category!=='Tagessuppe');
        return mains.map(item=>({name:(soup?soup.name+' + ':'')+item.name,price:item.price}));
      }
      return raw.map(item=>({name:item.name,price:item.price}));
    }
    function escapeHtml(value){
      return String(value??'').replace(/[&<>"']/g,chr=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[chr]));
    }
    function renderRow(restaurant){
      const items=visibleDishes(restaurant);
      const row=document.createElement('article');
      row.className='row';
      const initials={mensa:'M',campus:'C',glashaus:'G',baschly:'B',losteria:'L'};
      const label=initials[restaurant.id]||restaurant.name.charAt(0).toUpperCase();
      const dishRows=items.length ? items.map(item=>
        '<div class="menu-line"><span class="dish-text">'+escapeHtml(item.name)+'</span><span class="dish-price">'+(item.price==null?'':escapeHtml(formatPrice(item.price)))+'</span></div>'
      ).join('') : '<div class="empty-row">Kein Mittagsmenü für diesen Tag verfügbar.</div>';
      row.innerHTML='<div class="logo-cell"><div class="logo-box '+escapeHtml(brandClasses[restaurant.id]||'')+'" aria-label="'+escapeHtml(restaurant.name)+'">'+escapeHtml(label)+'</div></div>'
       +'<div class="menu-cell"><div class="restaurant-title"><h3>'+escapeHtml(restaurant.name)+'</h3></div>'
       +'<div class="menu-lines">'+dishRows+'</div>'
       +'<a class="source-link" href="'+escapeHtml(restaurant.url)+'" target="_blank" rel="noopener noreferrer">Zum Restaurant</a></div>';
      return row;
    }

    function renderList(){
      listView.innerHTML = '<div class="list"></div>';
      const list = listView.querySelector('.list');
      DATA.restaurants.forEach(r => list.appendChild(renderRow(r)));
    }



    let realMap=null;
    const locationInfo={
      mensa:{address:'Welthandelsplatz 1, D1/TC, 1020 Wien',building:'D1/TC',lat:48.2129611,lon:16.4098281,letter:'M',color:'#e30613'},
      campus:{address:'Welthandelsplatz 1, Gebäude D2, 1020 Wien',building:'D2',lat:48.21213,lon:16.41021,letter:'C',color:'#387dda'},
      baschly:{address:'Welthandelsplatz 1, Gebäude D4, 1020 Wien',building:'D4',lat:48.21445,lon:16.40743,letter:'B',color:'#8a55a6'},
      glashaus:{address:'Am Grünen Prater 11, 1020 Wien',building:'Am Grünen Prater 11',lat:48.2118847,lon:16.4120651,letter:'G',color:'#6f9e39'},
      losteria:{address:'Freudplatz 2, 1020 Wien',building:'D5/Freudplatz',lat:48.21468,lon:16.4052,letter:'L',color:'#bc7837'}
    };
    function loadRealMap(){
      if(!window.L){
        mapStage.innerHTML='<div class="map-error">Die interaktive Karte ist derzeit nicht verfügbar. Über die unten stehenden Links lassen sich die Standorte auf OpenStreetMap öffnen.</div>';
        return;
      }
      if(!realMap){
        mapStage.replaceChildren();
        realMap=L.map(mapStage,{scrollWheelZoom:false,zoomControl:true}).setView([48.2132,16.4088],16);
        L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png',{
          attribution:'&copy; <a href="https://www.openstreetmap.org/copyright" target="_blank" rel="noopener noreferrer">OpenStreetMap-Mitwirkende</a>',
          maxZoom:19,detectRetina:false
        }).addTo(realMap);
        const bounds=[];
        DATA.restaurants.forEach(restaurant=>{
          const info=locationInfo[restaurant.id];
          if(!info)return;
          const icon=L.divIcon({
            className:'leaflet-div-icon',
            html:'<span class="map-pin" style="background:'+info.color+'">'+info.letter+'</span>',
            iconSize:[38,38],iconAnchor:[19,19],popupAnchor:[0,-18]
          });
          const marker=L.marker([info.lat,info.lon],{icon,title:restaurant.name}).addTo(realMap);
          const content=document.createElement('div');
          const title=document.createElement('strong');title.textContent=restaurant.name;
          const address=document.createElement('p');address.textContent=info.address;
          const directions=document.createElement('a');
          directions.textContent='Route öffnen';
          directions.href='https://www.openstreetmap.org/directions?to='+info.lat+'%2C'+info.lon;
          directions.target='_blank';directions.rel='noopener noreferrer';
          content.append(title,address,directions);
          marker.bindPopup(content);
          bounds.push([info.lat,info.lon]);
        });
        realMap.fitBounds(bounds,{padding:[40,40],maxZoom:17});
      }
      requestAnimationFrame(()=>realMap.invalidateSize({pan:false}));
      setTimeout(()=>realMap.invalidateSize({pan:false}),250);
    }
    function renderMap(){
      mapList.replaceChildren();
      DATA.restaurants.forEach(r=>{
        const info=locationInfo[r.id];
        const card=document.createElement('div');card.className='map-card';
        const title=document.createElement('h4');title.textContent=r.name+' · '+info.building;
        const location=document.createElement('p');location.textContent=info.address;
        const link=document.createElement('a');link.textContent='Auf OpenStreetMap suchen ↗';link.href='https://www.openstreetmap.org/search?query='+encodeURIComponent(r.name+' '+info.address);link.target='_blank';link.rel='noopener noreferrer';
        card.append(title,location,link);mapList.append(card);
      });
    }
    function update(){
      renderTabs();
      renderList();
      renderMap();
      document.querySelectorAll('.view-tab').forEach(btn=>{
        const active = btn.dataset.view === currentView;
        btn.classList.toggle('active', active);
        btn.setAttribute('aria-selected', active ? 'true' : 'false');
      });
      listView.classList.toggle('active', currentView === 'list');
      mapView.classList.toggle('active', currentView === 'map'); if(currentView === 'map') loadRealMap();
    }

    document.querySelectorAll('.view-tab').forEach(btn=>{
      btn.addEventListener('click',()=>{currentView = btn.dataset.view; update();});
    });

    update();
  </script>
