name: WU Lunch Android APK

on:
  workflow_dispatch:
    inputs:
      aufgabe:
        description: 'app-bauen: APK + App-Bundle für Google Play. app-bauen-und-play-intern: zusätzlich in den internen Test von Google Play hochladen. play-zugang-pruefen: nur den Play-Zugang prüfen, nichts ändern. upload-schluessel-erzeugen: einmalig den Upload-Schlüssel anlegen. signatur-testen: Probelauf mit Wegwerf-Schlüssel, ohne Ergebnis-Dateien.'
        type: choice
        options: [app-bauen, app-bauen-und-play-intern, play-zugang-pruefen, upload-schluessel-erzeugen, signatur-testen]
        default: app-bauen
  pull_request:
    paths: ['wu-lunch-app/**', '.github/workflows/wu-lunch-android.yml']

permissions:
  contents: read

jobs:
  # Einmalig: Upload-Schlüssel für Google Play erzeugen und direkt als Repository-Secrets speichern.
  # Der Schlüssel erscheint nirgends im Klartext (nicht im Log, nicht als Datei zum Herunterladen).
  # Voraussetzung: Secret SECRETS_TOKEN = Fine-grained Token mit "Secrets: Read and write" nur für dieses Repository.
  # Geht der Schlüssel verloren, lässt er sich in der Play Console zurücksetzen (Play App Signing).
  upload-key:
    if: github.event_name == 'workflow_dispatch' && inputs.aufgabe == 'upload-schluessel-erzeugen'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Upload-Schlüssel erzeugen und als Secrets speichern
        env:
          GH_TOKEN: ${{ secrets.SECRETS_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          set -euo pipefail
          if [ -z "$GH_TOKEN" ]; then echo "::error::Secret SECRETS_TOKEN fehlt (siehe Anleitung)."; exit 1; fi
          existing=$(gh secret list --repo "$REPO" --json name --jq '.[].name')
          if printf '%s\n' "$existing" | grep -qx ANDROID_UPLOAD_KEYSTORE_BASE64; then
            echo "::error::Es gibt bereits einen Upload-Schlüssel. Er wird nicht überschrieben (sonst passt er nicht mehr zur Play Console)."; exit 1
          fi
          work=$(mktemp -d); trap 'rm -rf "$work"' EXIT
          pass=$(openssl rand -hex 32); echo "::add-mask::$pass"
          keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$work/upload.p12" -alias upload \
            -keyalg RSA -keysize 4096 -validity 10000 -dname "CN=WU Food, C=AT" -storepass "$pass" -keypass "$pass" >/dev/null 2>&1
          base64 -w0 "$work/upload.p12" | gh secret set ANDROID_UPLOAD_KEYSTORE_BASE64 --repo "$REPO"
          printf '%s' "$pass" | gh secret set ANDROID_UPLOAD_KEYSTORE_PASSWORD --repo "$REPO"
          fingerprint=$(keytool -list -v -keystore "$work/upload.p12" -storepass "$pass" -alias upload | grep -E 'SHA256:' | head -1 | sed 's/.*SHA256: *//')
          { echo "### Upload-Schlüssel angelegt"; echo; echo "Gespeichert als Secrets ANDROID_UPLOAD_KEYSTORE_BASE64 und ANDROID_UPLOAD_KEYSTORE_PASSWORD."; echo; echo "Zertifikat (öffentlich), SHA-256: \`$fingerprint\`"; } >> "$GITHUB_STEP_SUMMARY"

  # Nur prüfen, ob das Dienstkonto für Google Play funktioniert (Secret PLAY_SERVICE_ACCOUNT_JSON). Ändert nichts.
  play-check:
    if: github.event_name == 'workflow_dispatch' && inputs.aufgabe == 'play-zugang-pruefen'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: wu-lunch-app
    steps:
      - uses: actions/checkout@v4
      - name: Play-Zugang prüfen
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 -m venv "$RUNNER_TEMP/play"
          "$RUNNER_TEMP/play/bin/pip" install --quiet google-auth==2.38.0 requests==2.32.3
          "$RUNNER_TEMP/play/bin/python" scripts/upload-play.py --check

  build-apk:
    if: (github.event_name == 'workflow_dispatch' && inputs.aufgabe != 'upload-schluessel-erzeugen' && inputs.aufgabe != 'play-zugang-pruefen') || contains(github.event.pull_request.title, '[APK]')
    runs-on: ubuntu-latest
    timeout-minutes: 45
    defaults:
      run:
        working-directory: wu-lunch-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: wu-lunch-app/package-lock.json
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v4
      - name: Install dependencies
        run: npm ci
      - name: Read app version
        id: apk
        run: node -e "require('fs').appendFileSync(process.env.GITHUB_OUTPUT,'version='+require('./app.json').expo.version+'\n')"
      - name: Unit tests and type check
        run: npm run test && npx tsc --noEmit
      - name: Generate Android project
        run: CI=1 npx expo prebuild --platform android
      - name: Verify adaptive icon uses the dedicated full-bleed foreground
        # Das Motiv liegt in assets/adaptive-icon.png bereits in der sicheren Zone und
        # der Hintergrund füllt die ganze Vorlage; ein zusätzlicher Innenabstand
        # (früher 20 %) würde wieder einen sichtbaren Rand erzeugen.
        run: test ! -e android/app/src/main/res/drawable/ic_launcher_foreground_inset.xml && grep -rq '@mipmap/ic_launcher_foreground' android/app/src/main/res/mipmap-anydpi-v26/
      - name: Build APK and App Bundle (signed with the upload key when it exists)
        # Mit Upload-Schlüssel (Secrets) entstehen APK und App-Bundle (.aab) für Google Play, beide damit signiert.
        # Ohne Schlüssel bleibt es beim Test-APK mit dem öffentlichen Debug-Schlüssel (Google Play lehnt das ab).
        # "signatur-testen" prüft den Ablauf mit einem Wegwerf-Schlüssel; davon wird nichts veröffentlicht.
        working-directory: wu-lunch-app/android
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_UPLOAD_KEYSTORE_PASSWORD }}
          TRIAL: ${{ github.event_name == 'workflow_dispatch' && inputs.aufgabe == 'signatur-testen' }}
        run: |
          set -euo pipefail
          store="$RUNNER_TEMP/upload.p12"
          if [ "$TRIAL" = true ]; then
            KEYSTORE_PASSWORD=$(openssl rand -hex 32); echo "::add-mask::$KEYSTORE_PASSWORD"
            keytool -genkeypair -noprompt -storetype PKCS12 -keystore "$store" -alias upload -keyalg RSA -keysize 2048 \
              -validity 10000 -dname "CN=WU Food Probelauf, C=AT" -storepass "$KEYSTORE_PASSWORD" -keypass "$KEYSTORE_PASSWORD" >/dev/null 2>&1
          elif [ -n "$KEYSTORE_BASE64" ]; then
            printf '%s' "$KEYSTORE_BASE64" | base64 -d > "$store"
          fi
          if [ -s "$store" ]; then
            ./gradlew assembleRelease bundleRelease \
              -Pandroid.injected.signing.store.file="$store" -Pandroid.injected.signing.store.password="$KEYSTORE_PASSWORD" \
              -Pandroid.injected.signing.key.alias=upload -Pandroid.injected.signing.key.password="$KEYSTORE_PASSWORD"
            rm -f "$store"; echo "EXPECT_UPLOAD_SIGNATURE=true" >> "$GITHUB_ENV"
          else
            echo "::warning::Kein Upload-Schlüssel eingerichtet: nur Test-APK, kein App-Bundle für Google Play."
            ./gradlew assembleRelease
          fi
      - name: Verify packaged design, permissions and signature; name the files
        run: python scripts/verify-apk.py
      - name: Enable emulator acceleration
        run: sudo chmod 666 /dev/kvm
      - name: Install and check the actual APK
        uses: reactivecircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_2
          disable-animations: true
          working-directory: wu-lunch-app
          script: python scripts/emulator-smoke.py
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: wu-food-android-proof
          path: wu-lunch-app/android-proof
          if-no-files-found: ignore
      - uses: actions/upload-artifact@v4
        # Beim Probelauf wird nichts veröffentlicht (keine zweite Datei mit derselben Versionsnummer).
        if: ${{ !(github.event_name == 'workflow_dispatch' && inputs.aufgabe == 'signatur-testen') }}
        with:
          name: wu-food-android-${{ steps.apk.outputs.version }}
          path: |
            wu-lunch-app/android/app/build/outputs/apk/release/WU-Food-*.apk
            wu-lunch-app/android/app/build/outputs/apk/release/WU-Food-*.aab
            wu-lunch-app/android/app/build/outputs/apk/release/build-info.json
          if-no-files-found: error
      - name: Upload the App Bundle to the Google Play internal test
        # Nur bei der ausdrücklich gewählten Aufgabe, nach bestandener Prüfung im Emulator.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.aufgabe == 'app-bauen-und-play-intern' }}
        env:
          PLAY_SERVICE_ACCOUNT_JSON: ${{ secrets.PLAY_SERVICE_ACCOUNT_JSON }}
        run: |
          python3 -m venv "$RUNNER_TEMP/play"
          "$RUNNER_TEMP/play/bin/pip" install --quiet google-auth==2.38.0 requests==2.32.3
          "$RUNNER_TEMP/play/bin/python" scripts/upload-play.py "android/app/build/outputs/apk/release/WU-Food-${{ steps.apk.outputs.version }}.aab"
