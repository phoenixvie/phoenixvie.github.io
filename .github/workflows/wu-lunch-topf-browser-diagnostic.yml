name: WU Lunch – Topf & Deckel Browserdiagnose

on:
  workflow_dispatch:
  push:
    paths:
      - '.github/workflows/wu-lunch-topf-browser-diagnostic.yml'

permissions:
  contents: read

jobs:
  check-interactive-days:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Headless Browser für Menü-Tabs installieren
        run: |
          pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
      - name: Jeden sichtbaren Tages-Tab untersuchen
        run: python wu-lunch/ai-pilot/topf_browser_probe.py
      - name: Diagnosebericht sichern (ohne Produktionsänderung)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: topf-interactive-tabs
          path: wu-lunch/ai-pilot/diagnostics/topf-tabs.json
          retention-days: 7
          if-no-files-found: warn
