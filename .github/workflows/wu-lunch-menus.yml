name: WU Lunch – Speisepläne aktualisieren

on:
  schedule:
    # GitHub Actions plant in UTC: 06:15 UTC = 08:15 Sommerzeit,
    # 07:15 UTC = 08:15 Winterzeit. Der Guard führt nur einmal aus.
    - cron: '15 6,7 * * 1-5'
  workflow_dispatch:
  push:
    paths:
      - 'wu-lunch/scripts/**'
      - 'wu-lunch/requirements.txt'
      - '.github/workflows/wu-lunch-menus.yml'

permissions:
  contents: write

concurrency:
  group: wu-lunch-menus
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - id: guard
        name: Lokale Wiener Uhrzeit prüfen
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && "$(TZ=Europe/Vienna date +%H)" != "08" ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip == 'false'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: wu-lunch/requirements.txt
      - name: Abhängigkeiten installieren
        if: steps.guard.outputs.skip == 'false'
        run: pip install -r wu-lunch/requirements.txt
      - name: Offline-Tests
        if: steps.guard.outputs.skip == 'false'
        run: python wu-lunch/scripts/update_menus.py --smoke-test
      - id: importer
        name: Speisepläne prüfen und extrahieren
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set +e
          python wu-lunch/scripts/update_menus.py
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Änderungen nur bei Bedarf veröffentlichen
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          git config user.name "wu-lunch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add wu-lunch/data.js wu-lunch/data/menus.json wu-lunch/status.json
          if ! git diff --cached --quiet; then
            git commit -m "WU Lunch: Menüimport $(TZ=Europe/Vienna date +%F)"
            git pull --rebase origin "${{ github.event.repository.default_branch }}"
            git push origin HEAD:"${{ github.event.repository.default_branch }}"
          fi
      - name: Importstatus prüfen
        if: steps.guard.outputs.skip == 'false'
        run: |
          if [[ "${{ steps.importer.outputs.exit_code }}" != "0" ]]; then
            echo "::error::Alle Datenquellen konnten nicht verarbeitet werden – wu-lunch/status.json prüfen."
            exit 1
          fi
