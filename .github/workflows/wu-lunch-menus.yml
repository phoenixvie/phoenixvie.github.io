name: WU Lunch – Speisepläne aktualisieren

on:
  schedule:
    # Montag 06:15 bis 18:15 sowie Samstag 08:15 bis 18:15 Wiener Zeit:
    # neue Wochenpläne früh erkennen und die Samstagsvorschau befüllen.
    # Di–Fr weiterhin 08:15 bis 12:15. UTC deckt beide DST-Offsets ab;
    # die Prüfung unten filtert unerwünschte Stunden heraus.
    - cron: '15 4-17 * * 1'
    - cron: '15 6-11 * * 2-5'
    - cron: '15 6-17 * * 6'
  workflow_dispatch:
  push:
    # Clean-room test: menu data and cache cleared on 2026-11-06; run on this push.
    paths:
      - 'wu-lunch/scripts/**'
      - 'wu-lunch/requirements.txt'
      - 'wu-lunch/update-policy.json'
      - '.github/workflows/wu-lunch-menus.yml'
  pull_request:
    paths:
      - 'wu-lunch/index.html'
      - 'wu-lunch/admin.html'
      - 'wu-lunch/supabase-config.js'
      - 'wu-lunch/scripts/**'
      - 'wu-lunch/requirements.txt'
      - 'wu-lunch/update-policy.json'
      - '.github/workflows/wu-lunch-menus.yml'

permissions:
  contents: write

concurrency:
  group: wu-lunch-menus
  cancel-in-progress: false

jobs:
  test:
    name: WU Lunch Regressionstests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: wu-lunch/requirements.txt
      - name: Abhängigkeiten installieren
        run: pip install -r wu-lunch/requirements.txt
      - name: Offline- und Regressionstests
        run: |
          python wu-lunch/scripts/update_schedule.py --check
          python wu-lunch/scripts/update_menus.py --smoke-test
          python -m unittest discover -s wu-lunch/scripts -p 'test_*.py' -v
  sync:
    needs: test
    # A feature-branch push must NEVER run the production importer or publish to master.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WU_SOURCE_CAPTURE: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - id: guard
        name: Lokale Wiener Uhrzeit prüfen
        shell: bash
        run: |
          if python wu-lunch/scripts/update_schedule.py menus "${{ github.event_name }}"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
          else
            echo "skip=true" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip == 'false'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: wu-lunch/requirements.txt
      - name: Abhängigkeiten installieren
        if: steps.guard.outputs.skip == 'false'
        run: pip install -r wu-lunch/requirements.txt
      - name: Offline-Tests
        if: steps.guard.outputs.skip == 'false'
        run: python wu-lunch/scripts/update_menus.py --smoke-test
      - name: Parser-Regressionstests
        if: steps.guard.outputs.skip == 'false'
        run: python -m unittest discover -s wu-lunch/scripts -p 'test_*.py' -v
      - id: importer
        name: Speisepläne prüfen und extrahieren
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set +e
          python wu-lunch/scripts/run_step.py start
          python wu-lunch/scripts/run_step.py parser python wu-lunch/scripts/update_menus.py
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Neues oder geändertes Mensa-PDF vollständig mit Luna prüfen
        if: steps.guard.outputs.skip == 'false'
        continue-on-error: true
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          python wu-lunch/scripts/run_step.py mensa_ai python wu-lunch/scripts/update_mensa_ai.py --model gpt-6-luna
      - name: Mensa-Original und KI-Kandidat zur Prüfung sichern
        if: always() && steps.guard.outputs.skip == 'false'
        uses: actions/upload-artifact@v4
        with:
          name: mensa-source-and-candidate
          path: wu-lunch/ai-pilot/results/mensa-current.*
          if-no-files-found: ignore
          retention-days: 14
      - name: Karma Food und Finn – Originalquelle sicher aktualisieren
        if: steps.guard.outputs.skip == 'false'
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          # On first merge also import Finn's current menu once.
          # A verified unchanged image is cached; failed images are capped
          # to one paid attempt per image/day.
          python wu-lunch/scripts/run_step.py finn_karma python wu-lunch/scripts/update_new_restaurants.py
      - name: Topf Wochenkarte – Browser plus Luna-Kontrolle aller Tabs
        if: steps.guard.outputs.skip == 'false'
        continue-on-error: true
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          # Geplante Quellenanalyse Mo 07:15 und 11:15, Di–Sa um 11:15 Wien.
          # Bei Code-Änderungen sofort als Integrationstest ausführen.
          if ! python wu-lunch/scripts/update_schedule.py topf_browser "${{ github.event_name }}"; then
            echo "Topf Browser: außerhalb des konfigurierten Ausführungsfensters; kein Browserabruf."
            exit 0
          fi
          pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
          python wu-lunch/scripts/run_step.py topf_browser python wu-lunch/scripts/update_topf_browser.py
      - name: Luna prüft jede neue/geänderte Mittagsspeisekarte
        if: steps.guard.outputs.skip == 'false'
        continue-on-error: true
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          # On every source scan, changed/new source fingerprints trigger a
          # complete Luna audit; unchanged successful audits are cached.
          # Dedicated Finn image, Mensa PDF and Topf browser workflows stay
          # separate. No artificial two-restaurants-per-day bottleneck.
          python wu-lunch/scripts/run_step.py html_ai python wu-lunch/scripts/repair_menus_ai.py --max-calls 7
      - name: Veröffentlichungsänderungen mit Abrufzeit erfassen
        if: steps.guard.outputs.skip == 'false'
        continue-on-error: true
        run: python wu-lunch/scripts/run_step.py observe python wu-lunch/scripts/observe_publication.py --import-scan
      - name: Verwendete Originalquellen bei Menüänderung dauerhaft sichern
        if: always() && steps.guard.outputs.skip == 'false'
        run: python wu-lunch/scripts/run_step.py source_archive python wu-lunch/scripts/source_archive.py
      - name: Tatsächliche Abrufe und Datenänderungen protokollieren
        if: always() && steps.guard.outputs.skip == 'false'
        run: python wu-lunch/scripts/run_step.py finish
      - name: Geprüfte Wochenkarte ins Admin-Archiv sichern
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        env:
          # The project URL is public; only the API secret is stored in GitHub.
          SUPABASE_URL: https://vswnqdqnohbuzbwmsdvv.supabase.co
          SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
        run: |
          set -euo pipefail
          # The service key exists only in GitHub Actions, never in the site.
          # If the secret has not been added yet, admin login backfills prior
          # repository versions once; publishing menus must still continue.
          if [[ -z "${SUPABASE_URL}" || -z "${SUPABASE_SERVICE_ROLE_KEY}" ]]; then
            echo "::warning::Admin-Archiv noch nicht automatisch verbunden (SUPABASE_URL oder SUPABASE_SERVICE_ROLE_KEY fehlt)."
            exit 0
          fi
          payload="$(jq -c --arg commit "${GITHUB_SHA}" '{week_start:.weekStart,menu_data:.,source_commit:$commit}' wu-lunch/data/menus.json)"
          curl --fail-with-body --silent --show-error --retry 3 --connect-timeout 10 \
            -X POST "${SUPABASE_URL}/rest/v1/menu_history?on_conflict=week_start" \
            -H "apikey: ${SUPABASE_SERVICE_ROLE_KEY}" \
            -H "Content-Type: application/json" \
            -H "Prefer: resolution=merge-duplicates,return=minimal" \
            --data "${payload}"
      - name: Änderungen nur bei Bedarf veröffentlichen
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          git config user.name "wu-lunch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${{ github.event.repository.default_branch }}"
          # Bei parallelen Code-/Datencommits auf dem neuesten Branch erneut importieren.
          # Nie konflikthafte JSON-Dateien blind zusammenführen oder force-pushen.
          for attempt in 1 2 3; do
            git add wu-lunch/data.js wu-lunch/data/menus.json wu-lunch/status.json
            git add wu-lunch/data/update-status.json wu-lunch/source-archive
            if [[ -f wu-lunch/data/mensa-ai-candidate.json ]]; then git add wu-lunch/data/mensa-ai-candidate.json; fi
            if [[ -f wu-lunch/data/repair-report.json ]]; then git add wu-lunch/data/repair-report.json; fi
            if [[ -f wu-lunch/data/publication-observations.json ]]; then git add wu-lunch/data/publication-observations.json; fi
            if git diff --cached --quiet; then
              echo "Keine Datenänderungen"
              exit 0
            fi
            git commit -m "WU Lunch: Menüimport $(TZ=Europe/Vienna date +%F)"
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            echo "Push-Konflikt, versuche erneuten Import ($attempt/3)"
            git fetch origin "$branch"
            cp wu-lunch/data/update-status.json wu-lunch/.source-capture/update-status-retry.json
            git reset --hard "origin/$branch"
            cp wu-lunch/.source-capture/update-status-retry.json wu-lunch/data/update-status.json
            python wu-lunch/scripts/run_step.py parser_retry python wu-lunch/scripts/update_menus.py
            python wu-lunch/scripts/run_step.py finn_karma_retry python wu-lunch/scripts/update_new_restaurants.py
            python wu-lunch/scripts/run_step.py mensa_ai_retry python wu-lunch/scripts/update_mensa_ai.py --model gpt-6-luna
            python wu-lunch/scripts/run_step.py html_ai_retry python wu-lunch/scripts/repair_menus_ai.py --max-calls 7
            python wu-lunch/scripts/run_step.py observe python wu-lunch/scripts/observe_publication.py --import-scan
            python wu-lunch/scripts/run_step.py source_archive python wu-lunch/scripts/source_archive.py
            python wu-lunch/scripts/run_step.py finish
          done
          echo "::error::Menüimport konnte nach drei Konfliktversuchen nicht veröffentlicht werden."
          exit 1
      - name: Importstatus prüfen
        if: steps.guard.outputs.skip == 'false'
        run: |
          if [[ "${{ steps.importer.outputs.exit_code }}" != "0" ]]; then
            echo "::error::Alle Datenquellen konnten nicht verarbeitet werden – wu-lunch/status.json prüfen."
            exit 1
          fi
          python - <<'PY'
          import json
          status=json.load(open('wu-lunch/status.json'))
          failed=[name for name in ('mensa','finn') if status.get('sources',{}).get(name,{}).get('state')=='error']
          if failed:
              raise SystemExit('Quellenprüfung fehlgeschlagen: '+', '.join(failed)+' – Details in wu-lunch/status.json')
          PY
