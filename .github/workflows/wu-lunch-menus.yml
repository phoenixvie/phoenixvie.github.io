name: WU Lunch – Speisepläne aktualisieren

on:
  schedule:
    # 5 lokale Prüfungen: 08:15, 09:15, 10:15, 11:15, 12:15 Wien.
    # UTC-Zeitfenster für Sommer-/Winterzeit, lokale Guard-Verifikation unten.
    - cron: '15 6-11 * * 1-5'
  workflow_dispatch:
  push:
    # Clean-room test: menu data and cache cleared on 2026-11-06; run on this push.
    paths:
      - 'wu-lunch/scripts/**'
      - 'wu-lunch/requirements.txt'
      - '.github/workflows/wu-lunch-menus.yml'

permissions:
  contents: write

concurrency:
  group: wu-lunch-menus
  cancel-in-progress: false

jobs:
  sync:
    # A feature-branch push must NEVER run the production importer or publish to master.
    if: github.ref == 'refs/heads/master'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
          fetch-depth: 0
      - id: guard
        name: Lokale Wiener Uhrzeit prüfen
        shell: bash
        run: |
          if [[ "${{ github.event_name }}" == "schedule" && ! "$(TZ=Europe/Vienna date +%H)" =~ ^(08|09|10|11|12)$ ]]; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
          fi
      - uses: actions/setup-python@v5
        if: steps.guard.outputs.skip == 'false'
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: wu-lunch/requirements.txt
      - name: Abhängigkeiten installieren
        if: steps.guard.outputs.skip == 'false'
        run: pip install -r wu-lunch/requirements.txt
      - name: Offline-Tests
        if: steps.guard.outputs.skip == 'false'
        run: python wu-lunch/scripts/update_menus.py --smoke-test
      - name: Parser-Regressionstests
        if: steps.guard.outputs.skip == 'false'
        run: python -m unittest discover -s wu-lunch/scripts -p 'test_*.py' -v
      - id: importer
        name: Speisepläne prüfen und extrahieren
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set +e
          python wu-lunch/scripts/update_menus.py
          result=$?
          echo "exit_code=$result" >> "$GITHUB_OUTPUT"
          exit 0
      - name: Topf Wochenkarte – alle fünf Tabs im Browser auslesen
        if: steps.guard.outputs.skip == 'false'
        continue-on-error: true
        shell: bash
        run: |
          set -euo pipefail
          # Geplante Quellenanalyse werktags um 11:15 Wien nach der Publikation.
          # Bei Code-Änderungen sofort als Integrationstest ausführen.
          if [[ "${{ github.event_name }}" == "schedule" && "$(TZ=Europe/Vienna date +%H)" != "11" ]]; then
            echo "Topf-Browserlauf für 11:15 Wien vorgesehen; regulärer Import läuft weiter."
            exit 0
          fi
          pip install 'playwright>=1.50,<2'
          python -m playwright install --with-deps chromium
          python wu-lunch/scripts/update_topf_browser.py
      - name: Mensa-PDF mit Luna reparieren (nur falls nötig)
        if: steps.guard.outputs.skip == 'false' && github.event_name != 'push'
        continue-on-error: true
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "workflow_dispatch" && "$(TZ=Europe/Vienna date +%H)" != "11" ]]; then
            echo "Mensa-KI läuft regulär um 11:15 Wien."
            exit 0
          fi
          python wu-lunch/scripts/update_mensa_ai.py --model gpt-6-luna
      - name: Luna-Qualitätskontrolle und sichere Nachbearbeitung
        if: steps.guard.outputs.skip == 'false' && github.event_name != 'push'
        continue-on-error: true
        shell: bash
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          set -euo pipefail
          if [[ "${{ github.event_name }}" != "workflow_dispatch" && "$(TZ=Europe/Vienna date +%H)" != "11" ]]; then
            echo "Luna-Reparatur läuft regulär um 11:15 Wien."
            exit 0
          fi
          python wu-lunch/scripts/repair_menus_ai.py --max-calls 2
      - name: Änderungen nur bei Bedarf veröffentlichen
        if: steps.guard.outputs.skip == 'false'
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "wu-lunch-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${{ github.event.repository.default_branch }}"
          # Bei parallelen Code-/Datencommits auf dem neuesten Branch erneut importieren.
          # Nie konflikthafte JSON-Dateien blind zusammenführen oder force-pushen.
          for attempt in 1 2 3; do
            git add wu-lunch/data.js wu-lunch/data/menus.json wu-lunch/status.json
            if [[ -f wu-lunch/data/repair-report.json ]]; then git add wu-lunch/data/repair-report.json; fi
            if git diff --cached --quiet; then
              echo "Keine Datenänderungen"
              exit 0
            fi
            git commit -m "WU Lunch: Menüimport $(TZ=Europe/Vienna date +%F)"
            if git push origin HEAD:"$branch"; then
              exit 0
            fi
            echo "Push-Konflikt, versuche erneuten Import ($attempt/3)"
            git fetch origin "$branch"
            git reset --hard "origin/$branch"
            python wu-lunch/scripts/update_menus.py
          done
          echo "::error::Menüimport konnte nach drei Konfliktversuchen nicht veröffentlicht werden."
          exit 1
      - name: Importstatus prüfen
        if: steps.guard.outputs.skip == 'false'
        run: |
          if [[ "${{ steps.importer.outputs.exit_code }}" != "0" ]]; then
            echo "::error::Alle Datenquellen konnten nicht verarbeitet werden – wu-lunch/status.json prüfen."
            exit 1
          fi
