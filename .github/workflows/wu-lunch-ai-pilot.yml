name: WU Lunch – KI-Direktanalyse (nur Vergleich)

on:
  workflow_dispatch:
    inputs:
      restaurant:
        description: 'Zu analysierende Quelle (all = alle neun)'
        required: true
        default: all
        type: choice
        options:
          - all
          - mensa
          - campus
          - glashaus
          - baschly
          - losteria
          - omakueche
          - topfdeckel
          - gruenehuette
          - lia
      model:
        description: 'KI-Modell für den direkten Quellenvergleich'
        required: true
        default: gpt-6.1-terra
        type: choice
        options:
          - gpt-6.1-terra
          - gpt-6-luna
  push:
    paths:
      - '.github/workflows/wu-lunch-ai-pilot.yml'
      - 'wu-lunch/ai-pilot/ai_direct.py'
      - 'wu-lunch/ai-pilot/test_ai_direct.py'
      - 'wu-lunch/ai-pilot/publish_ai.py'
      - 'wu-lunch/ai-pilot/test_publish_ai.py'

permissions:
  contents: write

concurrency:
  group: wu-lunch-ai-pilot
  cancel-in-progress: false

jobs:
  offline-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhängigkeiten
        run: pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: Syntax und unabhängige Offline-Tests
        run: |
          python -m py_compile wu-lunch/ai-pilot/ai_direct.py wu-lunch/ai-pilot/publish_ai.py
          python -m unittest discover -s wu-lunch/ai-pilot -p 'test_*.py' -v


  api-connection-check:
    # Sicherer, kostenloser Verbindungstest bei Änderung dieser Workflow-Datei.
    if: github.event_name == 'push'
    needs: offline-tests
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - name: OpenAI API-Authentifizierung ohne Menüdaten testen
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import json, os, sys, urllib.request, urllib.error
          key=os.environ.get("OPENAI_API_KEY","").strip()
          if not key:
              print("::error::Repository Secret OPENAI_API_KEY fehlt oder ist leer.")
              sys.exit(1)
          request=urllib.request.Request(
              "https://api.openai.com/v1/models",
              headers={"Authorization":"Bearer "+key,
                       "User-Agent":"WU-Lunch-AI-Connection-Check/1.0"})
          try:
              with urllib.request.urlopen(request,timeout=20) as response:
                  payload=json.load(response)
              models={m.get("id") for m in payload.get("data",[])}
              print("OpenAI-API: Authentifizierung erfolgreich (HTTP 200).")
              for model in ("gpt-6.1-terra","gpt-6-luna"):
                  print(f"Im Konto sichtbares Modell {model}: "+("ja" if model in models else "nein"))
          except urllib.error.HTTPError as exc:
              print(f"::error::OpenAI API HTTP {exc.code} – Authentifizierung/Berechtigungen prüfen.")
              sys.exit(1)
          except (OSError,ValueError) as exc:
              print("::error::OpenAI API nicht erreichbar oder Antwort ungültig: "+str(exc)[:150])
              sys.exit(1)
          PY

  analyze:
    needs: offline-tests
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Abhängigkeiten
        run: pip install 'requests>=2.31,<3' 'beautifulsoup4>=4.12,<5'
      - name: API-Schlüssel prüfen und Originalquellen direkt analysieren
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          SELECTED_RESTAURANT: ${{ inputs.restaurant }}
          SELECTED_MODEL: ${{ inputs.model }}
        shell: bash
        run: |
          if [[ -z "$OPENAI_API_KEY" ]]; then
            echo "::error::OPENAI_API_KEY fehlt. Unter Settings > Secrets and variables > Actions als Repository Secret hinterlegen."
            exit 2
          fi
          python wu-lunch/ai-pilot/ai_direct.py --restaurant "$SELECTED_RESTAURANT" --model "$SELECTED_MODEL"
      - name: Bericht als herunterladbares GitHub-Artefakt bereitstellen
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: wu-lunch-ai-direktanalyse
          path: |
            wu-lunch/ai-pilot/results/latest.json
            wu-lunch/ai-pilot/results/latest.html
          retention-days: 30
          if-no-files-found: warn
      - name: Ausschließlich isolierten KI-Vergleichsbericht speichern
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! -s wu-lunch/ai-pilot/results/latest.json ]]; then
            echo "Kein Modellbericht verfügbar; nichts veröffentlichen."
            exit 0
          fi
          git config user.name "wu-lunch-ai-pilot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          branch="${{ github.event.repository.default_branch }}"
          git add wu-lunch/ai-pilot/results/latest.json wu-lunch/ai-pilot/results/latest.html
          if git diff --cached --quiet; then
            echo "Unveränderter Ergebnisbericht."
            exit 0
          fi
          git commit -m "WU Lunch AI pilot: independent source comparison $(TZ=Europe/Vienna date +%F-%H%M)"
          git pull --rebase origin "$branch"
          git push origin HEAD:"$branch"
          echo "KI-Testbericht: https://phoenixvie.github.io/wu-lunch/ai-pilot/results/latest.html"
