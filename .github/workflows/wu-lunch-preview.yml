name: WU Food Webvorschau prüfen
on:
  pull_request:
    paths: ['_config.yml', 'wu-lunch/**', 'wu-lunch-app/**', '.github/workflows/wu-lunch-preview.yml']
  push:
    branches: [master]
    paths: ['_config.yml', 'wu-lunch/**', 'wu-lunch-app/**', '.github/workflows/wu-lunch-preview.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check wu-lunch-app/preview/app.js
      - run: node --test wu-lunch-app/scripts/preview-gestures.test.mjs wu-lunch-app/scripts/website-presentation.test.mjs wu-lunch-app/scripts/admin-data.test.mjs
  native-source:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wu-lunch-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: wu-lunch-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - name: JavaScript-Bundle prüfen (keine APK)
        run: npx expo export --platform android --output-dir ../android-source-check
  publish-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [preview, native-source]
    runs-on: ubuntu-latest
    permissions:
      pages: write
    steps:
      - name: Aktuellen Master auf GitHub Pages veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/pages/builds"
