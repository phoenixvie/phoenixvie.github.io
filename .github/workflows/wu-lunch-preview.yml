name: WU Food Webvorschau prüfen
on:
  pull_request:
    paths: ['_config.yml', 'wu-lunch/**', 'wu-lunch-app/**', '.github/workflows/wu-lunch-preview.yml']
  push:
    branches: [master]
    paths: ['_config.yml', 'wu-lunch/**', 'wu-lunch-app/**', '.github/workflows/wu-lunch-preview.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Einmaliger E-Mail-Versandtest für den Eigentümer
        if: github.event_name == 'pull_request' && github.event.pull_request.head.ref == 'feat/meet-preview-registration-20261115'
        run: |
          node -e "fetch('https://vswnqdqnohbuzbwmsdvv.supabase.co/auth/v1/otp',{method:'POST',headers:{'Content-Type':'application/json',apikey:'sb_publishable__LAhcQOUGtE-ACAN-RPKkw_UB7Nrub2'},body:JSON.stringify({email:'campusmenue@gmail.com',create_user:true})}).then(r=>{console.log('OTP request status:',r.status);if(!r.ok)process.exitCode=1}).catch(()=>{console.log('OTP request failed');process.exitCode=1})"
      - run: node --check wu-lunch-app/preview/app.js
      - run: node --check wu-lunch-app/preview/meet-live.js
      - run: node --test wu-lunch-app/scripts/preview-gestures.test.mjs wu-lunch-app/scripts/website-presentation.test.mjs wu-lunch-app/scripts/admin-data.test.mjs wu-lunch-app/scripts/meet-preview.test.mjs
  native-source:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wu-lunch-app
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: wu-lunch-app/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npx tsc --noEmit
      - name: JavaScript-Bundle prüfen (keine APK)
        run: npx expo export --platform android --output-dir ../android-source-check
  publish-preview:
    if: github.event_name == 'push' && github.ref == 'refs/heads/master'
    needs: [preview, native-source]
    runs-on: ubuntu-latest
    permissions:
      pages: write
    steps:
      - name: Aktuellen Master auf GitHub Pages veröffentlichen
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: gh api --method POST "repos/$GH_REPO/pages/builds"
