name: WU Food Webvorschau prüfen
on:
  pull_request:
    paths: ['wu-lunch-app/preview/**', 'wu-lunch-app/scripts/preview-gestures.test.mjs', '.github/workflows/wu-lunch-preview.yml']
  push:
    branches: [master]
    paths: ['wu-lunch-app/preview/**', 'wu-lunch-app/scripts/preview-gestures.test.mjs', '.github/workflows/wu-lunch-preview.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: node --check wu-lunch-app/preview/app.js
      - run: node --test wu-lunch-app/scripts/preview-gestures.test.mjs
