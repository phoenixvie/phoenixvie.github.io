name: WU Lunch – KI-Qualität (Offline-Tests)

on:
  push:
    paths:
      - '.github/workflows/wu-lunch-quality-ci.yml'
      - 'wu-lunch/scripts/repair_menus_ai.py'
      - 'wu-lunch/scripts/test_repair_menus_ai.py'
      - 'wu-lunch/scripts/update_mensa_ai.py'
      - 'wu-lunch/scripts/update_menus.py'
      - '.github/workflows/wu-lunch-menus.yml'
  pull_request:
    paths:
      - '.github/workflows/wu-lunch-quality-ci.yml'
      - 'wu-lunch/scripts/**'
      - '.github/workflows/wu-lunch-menus.yml'

permissions:
  contents: read

jobs:
  offline-quality-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: pip install -r wu-lunch/requirements.txt
      - name: Syntax
        run: |
          python -m py_compile wu-lunch/scripts/repair_menus_ai.py
          python -m py_compile wu-lunch/scripts/update_mensa_ai.py
          python -m py_compile wu-lunch/ai-pilot/ai_direct.py
      - name: Regression tests (no network, no model calls)
        run: python -m unittest discover -s wu-lunch/scripts -p 'test_*.py' -v
      - name: Live Karma menu source / PDF smoke check (no model calls)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from pathlib import Path
          filename=Path("wu-lunch/scripts/update_new_restaurants.py")
          spec=importlib.util.spec_from_file_location("karma_live_check",filename)
          script=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(script)
          today=datetime.now(ZoneInfo("Europe/Vienna")).date()
          monday=today-timedelta(days=today.weekday())
          import re
          from bs4 import BeautifulSoup
          from urllib.parse import urlencode
          for index,url in enumerate([
            script.KARMA_URL,
            script.KARMA_URL+"?wu_lunch_week="+monday.isoformat(),
            script.KARMA_URL+"?wu_lunch_nocache="+str(int(datetime.now().timestamp())),
          ]):
            raw=script.legacy.safe_get(url)
            match=re.search(r"Karma\\s+Food\\s+\\d{1,2}\\.\\d{1,2}\\.\\s*[-–]\\s*\\d{1,2}\\.\\d{1,2}\\.",BeautifulSoup(raw,"html.parser").get_text(" ",strip=True),re.I)
            print("Karma candidate",index,"bytes",len(raw),"range",match.group(0) if match else "NOT FOUND",flush=True)
            text=BeautifulSoup(raw,"html.parser").get_text(" ",strip=True)
            at=text.find("Karma Food")
            print("Karma page opening",text[at:at+130] if at>=0 else text[:130],flush=True)
          days,digest,pdf=script.fetch_karma(monday)
          assert len(days)==5 and all(len(items)>=2 for items in days.values())
          print("Karma live menu confirmed:",{d:len(items) for d,items in days.items()})
          print("Official price PDF:",pdf)
          PY
