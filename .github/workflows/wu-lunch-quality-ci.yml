name: WU Lunch – KI-Qualität (Offline-Tests)

on:
  push:
    paths:
      - '.github/workflows/wu-lunch-quality-ci.yml'
      - 'wu-lunch/scripts/repair_menus_ai.py'
      - 'wu-lunch/scripts/test_repair_menus_ai.py'
      - 'wu-lunch/scripts/update_mensa_ai.py'
      - 'wu-lunch/scripts/update_menus.py'
      - '.github/workflows/wu-lunch-menus.yml'
  pull_request:
    paths:
      - '.github/workflows/wu-lunch-quality-ci.yml'
      - 'wu-lunch/scripts/**'
      - '.github/workflows/wu-lunch-menus.yml'

permissions:
  contents: read

jobs:
  offline-quality-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Dependencies
        run: pip install -r wu-lunch/requirements.txt
      - name: Syntax
        run: |
          python -m py_compile wu-lunch/scripts/repair_menus_ai.py
          python -m py_compile wu-lunch/scripts/update_mensa_ai.py
          python -m py_compile wu-lunch/ai-pilot/ai_direct.py
      - name: Regression tests (no network, no model calls)
        run: python -m unittest discover -s wu-lunch/scripts -p 'test_*.py' -v
      - name: Live Karma menu source / PDF smoke check (no model calls)
        if: github.event_name == 'pull_request'
        continue-on-error: true
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util
          from datetime import datetime, timedelta
          from zoneinfo import ZoneInfo
          from pathlib import Path
          filename=Path("wu-lunch/scripts/update_new_restaurants.py")
          spec=importlib.util.spec_from_file_location("karma_live_check",filename)
          script=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(script)
          today=datetime.now(ZoneInfo("Europe/Vienna")).date()
          monday=today-timedelta(days=today.weekday())
          import re
          from bs4 import BeautifulSoup
          from urllib.parse import urlencode
          # Check published current/next-week header; the next-week plan
          # can appear on Friday before Monday morning.
          # The operator can publish next week's menu on Friday; verify that
          # separately without mislabeling the current week's menu.
          latest=script.legacy.safe_get(script.KARMA_URL)
          parsed=BeautifulSoup(latest,"html.parser").get_text(" ",strip=True)
          found=re.search(r"Karma\s+Food\s+(\d{1,2})\.(\d{1,2})\.\s*[-–]\s*(\d{1,2})\.(\d{1,2})\.",parsed,re.I)
          assert found, "Karma: datierter Wochenkopf fehlt"
          start=datetime(monday.year,int(found.group(2)),int(found.group(1))).date()
          assert start in (monday,monday+timedelta(days=7)), "Karma: unerwartete Wochenquelle"
          days,digest,pdf=script.fetch_karma(start)
          assert len(days)==5 and all(len(items)>=2 for items in days.values())
          print("Karma verified week:",start,"menus:",{d:len(items) for d,items in days.items()})
          print("Official price PDF:",pdf)
          prices={price for rows in days.values() for price in [item["price"] for item in rows]}
          print("Karma verified prices",sorted(prices))
          # Finn's previous-week image must be rejected as a current menu.
          finn_html=script.legacy.safe_get(script.FINN_URL)
          try:
            current_image=script.select_finn_image(finn_html,monday)
            print("Finn current image:",current_image)
          except ValueError as error:
            print("Finn correctly not published for this week:",str(error)[:130])
          PY
      - name: Finn original JPEG two-model integration (temporary acceptance test)
        if: github.event_name == 'pull_request' && github.event.pull_request.number == 4
        continue-on-error: true
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        shell: bash
        run: |
          python - <<'PY'
          import importlib.util, os
          from pathlib import Path
          from datetime import datetime,timedelta
          from zoneinfo import ZoneInfo
          p=Path("wu-lunch/scripts/update_new_restaurants.py")
          spec=importlib.util.spec_from_file_location("finn_acceptance",p)
          script=importlib.util.module_from_spec(spec)
          spec.loader.exec_module(script)
          today=datetime.now(ZoneInfo("Europe/Vienna")).date()
          monday=today-timedelta(days=today.weekday())
          days,sha,url=script.fetch_finn(monday,key=os.environ["OPENAI_API_KEY"],previous={})
          print("Finn image URL:",url)
          print("Finn two-model validation:",{k:len(v) for k,v in days.items()})
          print("Finn prices:",sorted({x["price"] for v in days.values() for x in v}))
          PY
